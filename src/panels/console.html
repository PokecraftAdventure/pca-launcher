<div class="container">
    <!-- Pantalla de carga (anillo): el registro completo vive en su propia ventana (src/log.html) -->
    <section class="load-view">
        <div class="load-mark"><div class="load-ring"></div><img class="load-logo" src="assets/images/logo.svg" alt=""></div>
        <div class="load-title">Cargando Minecraft</div>
        <div class="load-sub">Preparando…</div>
        <div class="load-peek"></div>
        <div class="load-btns">
            <button type="button" class="pa-btn load-more">Ver registros</button>
            <button type="button" class="pa-btn load-cancel">Cancelar</button>
        </div>
        <div class="load-note">La primera vez puede tardar unos minutos.</div>
    </section>
</div>
